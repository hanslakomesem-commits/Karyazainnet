          git diff --check

      - name: Pastikan dependensi dan uji build ZAIN.NET
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          # Compile new backend route in isolation before the Vite frontend build.
          ./node_modules/.bin/esbuild server/hardcoverCoverOcr/customLayout.ts --format=esm --platform=node --bundle --packages=external --outfile=/tmp/zainnet-custom-layout-check.mjs
          npm run build

      - name: Simpan ke branch main jika build berhasil
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/hardcover-link2/index.html public/hardcover-link2/custom-scan.html public/hardcover-link2/custom-scan.js server.ts server/hardcoverCoverOcr/customLayout.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Perubahan Custom Scan sudah terpasang, tidak perlu commit ulang.'
          else
            git commit -m 'feat(menu12-link2): custom scan free-layout reconstruction for new campuses'
            git push origin HEAD:main
          fi
          echo 'Deploy GitHub Pages dan Render harus menggunakan commit yang baru.'
