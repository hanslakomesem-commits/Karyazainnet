              target=pathlib.Path(name)
              if name.startswith('public/') or name.startswith('server/'):
                target.parent.mkdir(parents=True, exist_ok=True)
                target.write_bytes(z.read(name))
              elif name == 'patch_apply.py':
                pathlib.Path('/tmp/apply_custom_scan.py').write_bytes(z.read(name))
          subprocess.run(['python3','/tmp/apply_custom_scan.py'],check=True)
          PYCODE
