name: ZAIN.NET - Fix Duplikasi Prodi dan Fakultas Menu 12 Link 2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zainnet-menu12-identity-duplicate
  cancel-in-progress: false

jobs:
  fix-identity:
    name: Cegah duplikasi awalan prodi dan fakultas pada PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch normalisasi PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64
          exec(compile(base64.b64decode(''), 'menu12_fix.py', 'exec'))
          PYTHON

      - name: Uji prodi dan fakultas (duplikasi, input bersih, dan bahasa Inggris)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { normalizeCoverAcademicIdentity, plainCoverIdentity } from './public/hardcover-link2/classifier.js';
          const examples = [
            ['PROGRAM STUDI PROGRAM STUDI PENDIDIKAN AGAMA ISLAM','FAKULTAS FAKULTAS TARBIYAH','PENDIDIKAN AGAMA ISLAM','TARBIYAH'],
            ['Program Studi: Hukum Keluarga Islam','Fakultas: Syariah','Hukum Keluarga Islam','Syariah'],
            ['PRODI HTN','FAKULTAS SYARIAH','HTN','SYARIAH'],
            ['PENDIDIKAN AGAMA ISLAM','TARBIYAH','PENDIDIKAN AGAMA ISLAM','TARBIYAH'],
            ['PROGRAM STUDI: PROGRAM STUDI EKONOMI SYARIAH','FAKULTAS: FAKULTAS EKONOMI DAN BISNIS ISLAM','EKONOMI SYARIAH','EKONOMI DAN BISNIS ISLAM'],
          ];
          for (const [prodi, fakultas, expectedProdi, expectedFaculty] of examples) {
            const clean = normalizeCoverAcademicIdentity({prodi,fakultas});
            assert.equal(clean.prodi,expectedProdi);
            assert.equal(clean.fakultas,expectedFaculty);
            const pdf = plainCoverIdentity({...clean,bahasa:'id'});
            assert.equal(pdf.prodiLine,`PROGRAM STUDI ${expectedProdi.toUpperCase()}`);
            assert.equal(pdf.fakultasLine,`FAKULTAS ${expectedFaculty.toUpperCase()}`);
            assert.deepEqual(normalizeCoverAcademicIdentity(clean),clean);
          }
          const english=normalizeCoverAcademicIdentity({prodi:'Study Program of English Education',fakultas:'Faculty of Education'});
          assert.equal(english.prodi,'Study Program of English Education');
          assert.equal(english.fakultas,'Faculty of Education');
          console.log('Tests passed: no duplicate prefixes and English remains unchanged.');
          NODE
          node --check public/hardcover-link2/classifier.js
          node --check public/hardcover-link2/pdf-engine.js

      - name: Install dan build website
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit dan push jika lolos pengujian
        shell: bash
        run: |
          set -euo pipefail
          git add public/hardcover-link2/classifier.js public/hardcover-link2/pdf-engine.js
          if git diff --cached --quiet; then
            echo 'Source sudah sesuai, tidak perlu commit ulang.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(menu12): remove duplicate program studi and fakultas labels in cover PDFs'
          git push origin HEAD:main
