      - name: Audit sintaks dan pertahanan Q/O, italic, transliterasi
        shell: bash
        run: |
          set -euo pipefail
          node --check public/hardcover-link2/app.js
          node --check public/hardcover-link2/document-reader.js
          node --check public/hardcover-link2/gemini-cover-ocr.js
          node --check public/hardcover-link2/title-format.js
          node --check public/hardcover-link2/transliteration-check.js
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {validateGeminiResult} from './public/hardcover-link2/gemini-cover-ocr.js';
          import {titleHasTransliteration} from './public/hardcover-link2/title-format.js';
          const judul='KAJIAN AL-QUR’ĀN DAN ṢAḤĪḤ AL-BUKHĀRĪ DALAM QUALITY OF EDUCATION';
          const out=validateGeminiResult({judul,title_segments:[
            {text:'KAJIAN AL-QUR’ĀN DAN ṢAḤĪḤ AL-BUKHĀRĪ DALAM ',italic:false},
            {text:'QUALITY OF EDUCATION',italic:true}
          ],nama:'MUḤAMMAD',warnings:[]});
          assert.equal(out.judul,judul);
          assert.equal(out.title_segments.map(x=>x.text).join(''),judul);
          assert.equal(out.title_segments[1].italic,true);
          assert.equal(out.transliteration_detected,true);
          assert.ok(out.warnings.some(w=>/transliterasi arab/i.test(w)));
          assert.ok(titleHasTransliteration('maʿrifah'));
          assert.ok(titleHasTransliteration('a\u0304'));
          assert.ok(out.judul.includes('QUR') && out.judul.includes('QUALITY'));
          const decomposed='KAJIAN a\u0304 DAN ḥ';
          const normalized=validateGeminiResult({judul:decomposed,title_segments:[{text:decomposed,italic:true}]});
          assert.equal(normalized.judul,decomposed.normalize('NFC'));
          assert.equal(normalized.title_segments.map(x=>x.text).join(''),normalized.judul);
          console.log('LULUS: Q/O, italic, tanda transliterasi Arab-Latin, hamzah/ain, Unicode NFC');
          JS
          git diff --check

      - name: Pasang dependensi ZAIN.NET
        run: npm install --no-audit --no-fund

      - name: Periksa endpoint Gemini TypeScript
        run: npx --no-install esbuild server/hardcoverCoverOcr/router.ts --bundle --platform=node --packages=external --outfile=/tmp/zainnet-cover-transliteration-router.js

      - name: Build website (tanpa mengubah Menu 12 Link 1)
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm run build
          test -s dist/hardcover-link2/gemini-cover-ocr.js
          test -s dist/hardcover-link2/transliteration-check.js
          test -s dist/hardcover-link2/title-format.js
          cp dist/index.html dist/404.html

      - name: Commit hasil hanya jika seluruh pengujian lulus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server.ts \
            server/hardcoverCoverOcr/router.ts \
            public/hardcover-link2/gemini-cover-ocr.js \
            public/hardcover-link2/transliteration-check.js \
            public/hardcover-link2/document-reader.js \
            public/hardcover-link2/title-format.js \
            public/hardcover-link2/app.js \
            public/hardcover-link2/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Semua pembaruan sudah ada di main. Tidak membuat commit ganda.'
            exit 0
          fi
          git commit -m 'feat(menu12-link2): Gemini OCR Q/O, italic and Arabic Latin transliteration'
          git push origin HEAD:main
          echo 'Source sudah diperbarui. Periksa deploy GitHub Pages dan Render pada commit terbaru.'
