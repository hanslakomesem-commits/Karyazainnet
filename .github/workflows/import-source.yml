
name: Import ZAIN.NET source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source code
        shell: bash
        run: |
          set -euo pipefail
          test -f ZAINNET_SOURCE_UPLOAD.tar.zst
          tar --zstd -xf ZAINNET_SOURCE_UPLOAD.tar.zst

      - name: Remove exposed Midtrans Server Keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              rb'(?:SB-)?Mid-server-[A-Za-z0-9_-]{10,}'
          )

          text_ext = {
              '.ts', '.tsx', '.js', '.jsx',
              '.json', '.html', '.md', '.mjs',
              '.cjs', '.txt', '.yaml', '.yml',
              '.env', '.example'
          }

          count = 0

          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if '.git' in path.parts:
                  continue
              if path.suffix.lower() not in text_ext:
                  continue

              content = path.read_bytes()
              clean, n = pattern.subn(b'', content)

              if n:
                  path.write_bytes(clean)
                  count += n
                  print('Removed key from:', path)

          print('Total keys removed:', count)

          if count < 2:
              raise SystemExit(
                  'Expected 2 exposed keys; inspect source'
              )
          PY

      - name: Commit sanitized source
        shell: bash
        run: |
          set -euo pipefail
          rm -f ZAINNET_SOURCE_UPLOAD.tar.zst

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m 'Import sanitized ZAIN.NET source code'
            git push origin HEAD:main
          fi
