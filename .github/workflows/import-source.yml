name: Import ZAIN.NET source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source code
        run: |
          tar --zstd -xf ZAINNET_SOURCE_UPLOAD.tar.zst
          rm ZAINNET_SOURCE_UPLOAD.tar.zst

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full ZAIN.NET source"
          git push
