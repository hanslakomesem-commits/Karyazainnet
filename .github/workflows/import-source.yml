name: Import ZAIN.NET source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZAIN.NET source
        shell: bash
        run: |
          set -euo pipefail
          test -f ZAINNET_SOURCE_UPLOAD.tar.zst
          tar --zstd -xf ZAINNET_SOURCE_UPLOAD.tar.zst

      - name: Remove exposed Midtrans keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              rb'(?:SB-)?Mid-server-[A-Za-z0-9_-]{10,}'
          )

          extensions = {
              '.ts', '.tsx', '.js', '.jsx',
              '.json', '.html', '.md', '.mjs',
              '.cjs', '.txt', '.yaml', '.yml',
              '.env', '.example'
          }

          count = 0

          for file in Path('.').rglob('*'):
              if not file.is_file():
                  continue
              if '.git' in file.parts:
                  continue
              if file.suffix.lower() not in extensions:
                  continue

              data = file.read_bytes()
              clean, n = pattern.subn(
                  b'', data
              )

              if n:
                  file.write_bytes(clean)
                  count += n
                  print('Sanitized:', file)

          print('Keys removed:', count)

          if count < 2:
              raise SystemExit(
                  'Expected exposed keys not found'
              )
          PY

      - name: Remove restricted workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pages.yml
          rm -f ZAINNET_SOURCE_UPLOAD.tar.zst
          echo "Restricted workflow excluded"

      - name: Commit ZAIN.NET source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import ZAIN.NET source V3"
            git push origin HEAD:main
          fi
