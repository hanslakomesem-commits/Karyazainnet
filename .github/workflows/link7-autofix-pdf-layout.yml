name: ZAIN.NET - Link 7 Auto Perbaiki Teks PDF

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/link7-autofix-pdf-layout.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: link7-autoheal-pdf
  cancel-in-progress: false

jobs:
  install:
    name: Perbaiki konverter PDF pada Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Pasang mesin perbaikan salinan DOCX
        shell: bash
        run: |
          mkdir -p server/journal7
          cat > server/journal7/auto_repair.py <<'PY_AUTOHEAL'
          #!/usr/bin/env python3
          """ZAIN.NET: narrowly fix overlapping floating Word text boxes in header copies.

          Never mutate the uploaded DOCX. This script writes only an optional temporary
          repaired DOCX. Uses Python stdlib to stay lightweight on Render Free.
          """
          import json
          import re
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          ANCHOR = re.compile(r'<wp:anchor(?=[\s>])[\s\S]*?</wp:anchor>')
          VERTICAL = re.compile(r'(<wp:positionV\b[^>]*>[\s\S]*?<wp:posOffset>)(-?\d+)(</wp:posOffset>)')
          HORIZONTAL = re.compile(r'<wp:positionH\b[^>]*>[\s\S]*?<wp:posOffset>(-?\d+)</wp:posOffset>')
          EXTENT = re.compile(r'<wp:extent\b[^>]*?\bcx="(\d+)"[^>]*?\bcy="(\d+)"')
          EXTENT_REV = re.compile(r'<wp:extent\b[^>]*?\bcy="(\d+)"[^>]*?\bcx="(\d+)"')
          HEADER_NAME = re.compile(r'^word/header\d+\.xml$')
          MARGIN = re.compile(r'<w:pgMar\b[^>]*?\bw:header="(\d+)"')
          TEXT = re.compile(r'<w:t(?:\s[^>]*)?>([^<]+)</w:t>')


          def header_distance(main_xml: str) -> int:
              for match in MARGIN.finditer(main_xml):
                  twips = int(match.group(1))
                  if 500 <= twips <= 3300:
                      return twips * 635
              return 1080000  # 1.18 inch: a conservative fallback


          def overlaps(left, right):
              lx, ly, lw, lh = left['x'], left['y'], left['w'], left['h']
              rx, ry, rw, rh = right['x'], right['y'], right['w'], right['h']
              overlap_x = min(lx + lw, rx + rw) - max(lx, rx)
              overlap_y = min(ly + lh, ry + rh) - max(ly, ry)
              return (overlap_x > min(lw, rw) * 0.25 and
                      overlap_y > min(lh, rh) * 0.45)


          def repair_header(xml: str, baseline: int):
              candidates = []
              for match in ANCHOR.finditer(xml):
                  value = match.group(0)
                  if '<w:txbxContent' not in value:  # Leave logos, photos, decorations alone.
                      continue
                  y = VERTICAL.search(value)
                  x = HORIZONTAL.search(value)
                  e = EXTENT.search(value)
                  if e:
                      w, h = int(e.group(1)), int(e.group(2))
                  else:
                      e = EXTENT_REV.search(value)
                      if not e:
                          continue
                      h, w = int(e.group(1)), int(e.group(2))
                  visible_text = ''.join(TEXT.findall(value))
                  if not x or not y or w < 10000 or h < 10000 or len(visible_text.strip()) < 10:
                      continue
                  candidates.append({
                      'start': match.start(), 'end': match.end(), 'value': value,
                      'x': int(x.group(1)), 'y': int(y.group(2)),
                      'w': w, 'h': h,
                  })

              final_y = {}
              changed = 0
              replacements = []
              for i, current in enumerate(candidates):
                  prior_collisions = [j for j in range(i)
                                      if overlaps(current, candidates[j])]
                  # A textbox at the first PDF pixel is not a normal thesis heading.
                  at_page_edge = current['y'] < baseline * 0.3
                  if not at_page_edge and not prior_collisions:
                      final_y[i] = current['y']
                      continue
                  chosen = max(current['y'], baseline)
                  for j in prior_collisions:
                      previous = candidates[j]
                      chosen = max(chosen, final_y[j] + previous['h'] + 160000)
                  final_y[i] = chosen
                  if chosen == current['y']:
                      continue
                  fixed = VERTICAL.sub(
                      lambda m: m.group(1) + str(chosen) + m.group(3),
                      current['value'], count=1,
                  )
                  if fixed == current['value']:
                      continue
                  replacements.append((current['start'], current['end'], fixed))
                  changed += 1

              for start, end, patch in reversed(replacements):
                  xml = xml[:start] + patch + xml[end:]
              return xml, changed


          def main(src: Path, dst: Path):
              if src.resolve() == dst.resolve():
                  raise ValueError('Refusing to overwrite original DOCX')
              with ZipFile(src, 'r') as source:
                  entries = source.infolist()
                  if len(entries) > 6000 or sum(i.file_size for i in entries) > 200_000_000:
                      raise ValueError('DOCX terlalu besar untuk diproses dengan aman')
                  xml = source.read('word/document.xml').decode('utf-8')
                  baseline = header_distance(xml)
                  changes = 0
                  repaired_parts = {}
                  for entry in entries:
                      if HEADER_NAME.match(entry.filename):
                          data = source.read(entry.filename)
                          if len(data) > 4_000_000:
                              continue
                          patched, count = repair_header(data.decode('utf-8'), baseline)
                          if count:
                              repaired_parts[entry.filename] = patched.encode('utf-8')
                              changes += count
                  # Do not create another copy if no defect was identified.
                  if changes:
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      with ZipFile(dst, 'w') as target:
                          for entry in entries:
                              target.writestr(entry, repaired_parts.get(entry.filename, source.read(entry.filename)))
              return {'repaired': changes, 'headers': sorted(repaired_parts)}


          if __name__ == '__main__':
              if len(sys.argv) != 3:
                  raise SystemExit('Usage: auto_repair.py source.docx repaired.docx')
              print(json.dumps(main(Path(sys.argv[1]), Path(sys.argv[2]))))
          PY_AUTOHEAL
          cat > /tmp/link7_patch_source.py <<'PY_PATCH_SOURCE'
          from pathlib import Path


          def unique(s: str, old: str, new: str, label: str) -> str:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {n}. Aborting safely.")
              return s.replace(old, new, 1)


          def patch_router() -> None:
              p = Path('server/journal7/router.ts')
              original = p.read_text(encoding='utf-8')
              marker = 'ZAINNET_LINK7_AUTOHEAL_DOCX_PDF_20261111'
              if marker in original:
                  print('Router already updated')
                  return
              s = original
              begin = s.index('// ZAINNET_LINK7_AUTO_PDF_FROM_WORD_20261111')
              end = s.index('// Health check endpoint', begin)
              part = s[begin:end]
              part = unique(part,
                  "      const outputPath = path.join(dir, 'document.pdf');",
                  "      let outputPath = path.join(dir, 'document.pdf');",
                  'output path')
              part = unique(part,
                  "      await fsPromises.writeFile(inputPath, file.buffer, { flag: 'wx' });",
                  """      await fsPromises.writeFile(inputPath, file.buffer, { flag: 'wx' });
                // ZAINNET_LINK7_AUTOHEAL_DOCX_PDF_20261111
                // Never touch the uploaded Word. Only convert the temporary repaired copy.
                let conversionInput = inputPath;
                let autoFixedCount = 0;
                try {
                  const repairScript = path.join(process.cwd(), 'server', 'journal7', 'auto_repair.py');
                  const repairOutput = path.join(dir, 'document-autofix.docx');
                  const repairRun = await zipPdfExecFile('python3', [repairScript, inputPath, repairOutput], {
                    timeout: 20_000, maxBuffer: 64 * 1024, killSignal: 'SIGKILL',
                  });
                  const repairResult = JSON.parse(repairRun.stdout.trim() || '{}');
                  if (Number(repairResult.repaired) > 0) {
                    await fsPromises.access(repairOutput);
                    conversionInput = repairOutput;
                    outputPath = path.join(dir, 'document-autofix.pdf');
                    autoFixedCount = Number(repairResult.repaired);
                    console.info(`[ZAIN.NET Link7 AutoHeal] corrected ${autoFixedCount} textboxes in temporary PDF source`);
                  }
                } catch (repairError: any) {
                  // The existing original-DOCX conversion remains available if repair fails.
                  console.warn('[ZAIN.NET Link7 AutoHeal] repair skipped:', repairError?.message || repairError);
                }""",
                  'insert auto repair')
              part = unique(part,
                  "        '--convert-to', 'pdf:writer_pdf_Export', '--outdir', dir, inputPath,",
                  "        '--convert-to', 'pdf:writer_pdf_Export', '--outdir', dir, conversionInput,",
                  'LO input')
              part = unique(part,
                  "      res.setHeader('Content-Type', 'application/pdf');",
                  "      res.setHeader('X-Zainnet-AutoFixed', String(autoFixedCount));\n      res.setHeader('Content-Type', 'application/pdf');",
                  'response metadata')
              s = s[:begin] + part + s[end:]
              p.write_text(s, encoding='utf-8')
              print('Router updated')


          def patch_cors() -> None:
              p = Path('server.ts')
              s = p.read_text(encoding='utf-8')
              if "'X-Zainnet-AutoFixed'" in s:
                  print('CORS already updated')
                  return
              s = unique(s,
                "    res.setHeader('Access-Control-Allow-Origin', origin);",
                "    res.setHeader('Access-Control-Allow-Origin', origin);\n    res.setHeader('Access-Control-Expose-Headers', 'X-Zainnet-AutoFixed');",
                'CORS expose')
              p.write_text(s, encoding='utf-8')


          def patch_bundle() -> None:
              p = Path('src/journalConverter/utils/bundleExport.ts')
              s = p.read_text(encoding='utf-8')
              if 'ZAINNET_LINK7_AUTOHEAL_UI_20261111' in s:
                  print('Bundle already updated')
                  return
              s = unique(s,
                  'async function convertWordToPdf(source: Blob, filename: string): Promise<Blob> {',
                  'async function convertWordToPdf(source: Blob, filename: string, onAutoFix?: (count: number) => void): Promise<Blob> {',
                  'converter callback')
              s = unique(s,
                  '    const pdf = await response.blob();',
                  """    // ZAINNET_LINK7_AUTOHEAL_UI_20261111
              const fixed = Number(response.headers.get('X-Zainnet-AutoFixed') || '0');
              if (Number.isFinite(fixed) && fixed > 0) onAutoFix?.(fixed);
              const pdf = await response.blob();""",
                  'read auto fix metadata')
              s = unique(s,
                  '): Promise<{ blob: Blob; filename: string; layoutWarnings: string[] }> {',
                  '): Promise<{ blob: Blob; filename: string; layoutWarnings: string[]; autoFixedCount: number }> {',
                  'ZIP return type')
              s = unique(s,
                  "  const thesisPdf = await convertWordToPdf(thesis.word, 'Skripsi.docx');",
                  """  let autoFixedCount = 0;
            const thesisPdf = await convertWordToPdf(thesis.word, 'Skripsi.docx', count => {
              autoFixedCount += count;
              onProgress?.(`${count} kotak teks judul yang bertumpuk telah diperbaiki otomatis pada salinan PDF.`);
            });""",
                  'repair counter')
              s = unique(s,
                  '  return { blob, filename: `ZAINNET_Paket_Lengkap_${fileName}.zip`, layoutWarnings };',
                  '  return { blob, filename: `ZAINNET_Paket_Lengkap_${fileName}.zip`, layoutWarnings, autoFixedCount };',
                  'ZIP return info')
              p.write_text(s, encoding='utf-8')


          def patch_app() -> None:
              p = Path('src/journalConverter/App.tsx')
              s = p.read_text(encoding='utf-8')
              if 'ZAINNET_LINK7_AUTOHEAL_SUCCESS_20261111' in s:
                  print('App already updated')
                  return
              s = unique(s,
                  '  const [zipLayoutWarnings, setZipLayoutWarnings] = useState<string[]>([]);',
                  '  const [zipLayoutWarnings, setZipLayoutWarnings] = useState<string[]>([]);\n  const [zipAutoFixed, setZipAutoFixed] = useState(0);',
                  'App state')
              s = unique(s,
                  '    setZipLayoutWarnings([]);',
                  '    setZipLayoutWarnings([]);\n    setZipAutoFixed(0);',
                  'reset per ZIP')
              s = unique(s,
                  '      const { blob, filename, layoutWarnings } = await buildFiveFileBundle(',
                  '      const { blob, filename, layoutWarnings, autoFixedCount } = await buildFiveFileBundle(',
                  'ZIP result')
              s = unique(s,
                  '      setZipLayoutWarnings(layoutWarnings);',
                  '      setZipLayoutWarnings(layoutWarnings);\n      setZipAutoFixed(autoFixedCount);',
                  'App result')
              anchor='            {zipLayoutWarnings.length > 0 && ('
              s = unique(s,anchor,
                  """            {/* ZAINNET_LINK7_AUTOHEAL_SUCCESS_20261111 */}
                      {zipAutoFixed > 0 && (
                        <div role="status" className="my-2 rounded-lg bg-emerald-950 border border-emerald-400 p-3 text-sm text-emerald-100">
                          ✓ Perbaikan PDF otomatis dilakukan: {zipAutoFixed} kotak teks judul yang bertumpuk telah ditata ulang pada salinan PDF. Skripsi Word asli tetap utuh.
                        </div>
                      )}
          """+anchor,
                  'App success notice')
              p.write_text(s, encoding='utf-8')


          def patch_docker() -> None:
              p = Path('Dockerfile')
              s = p.read_text(encoding='utf-8')
              if '    python3 \\\n' in s:
                  return
              s = unique(s, '    libreoffice-writer \\\n', '    libreoffice-writer \\\n    python3 \\\n', 'explicit python3')
              p.write_text(s, encoding='utf-8')


          if __name__ == '__main__':
              patch_router()
              patch_cors()
              patch_bundle()
              patch_app()
              patch_docker()
              print('Link7 automatic Word header repair patched successfully')
          PY_PATCH_SOURCE
          python3 /tmp/link7_patch_source.py

      - name: Uji kode perbaikan tanpa dokumen mahasiswa
        shell: bash
        run: |
          python3 -m py_compile server/journal7/auto_repair.py
          python3 - <<'PY_TEST'
          import importlib.util
          path='server/journal7/auto_repair.py'
          spec=importlib.util.spec_from_file_location('zainnet_heal',path)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          def box(x,y):
              return ('<wp:anchor><wp:positionH><wp:posOffset>'+str(x)+'</wp:posOffset></wp:positionH>'
                      '<wp:positionV><wp:posOffset>'+str(y)+'</wp:posOffset></wp:positionV>'
                      '<wp:extent cx="1200000" cy="194310"/>'
                      '<w:txbxContent><w:p><w:r><w:t>JUDUL AKADEMIK</w:t></w:r></w:p></w:txbxContent>'
                      '</wp:anchor>')
          broken=box(1000000,0)+box(1000000,0)+box(1000000,0)
          fixed,n=mod.repair_header(broken,1080000)
          assert n==3, (n,fixed)
          assert fixed.count('<wp:posOffset>1080000</wp:posOffset>') >= 1
          assert '<wp:posOffset>1434310</wp:posOffset>' in fixed
          good=box(1000000,1080000)+box(1000000,1500000)
          same,n=mod.repair_header(good,1080000)
          assert n==0 and good==same
          print('OK: overlapping title is corrected; good document is not altered')
          PY_TEST

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Uji backend dan build web
        shell: bash
        env:
          VITE_BASE_PATH: /Karyazainnet/
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { transformSync } from 'esbuild';
          for (const file of ['server/journal7/router.ts','src/journalConverter/App.tsx','src/journalConverter/utils/bundleExport.ts']) {
            transformSync(readFileSync(file,'utf8'),{loader: file.endsWith('.tsx')?'tsx':'ts'});
            console.log('Syntax OK:',file);
          }
          NODE
          npm run build
      - name: Simpan hanya source code, tidak mengubah workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server/journal7/auto_repair.py server/journal7/router.ts server.ts src/journalConverter/utils/bundleExport.ts src/journalConverter/App.tsx Dockerfile
          if git diff --cached --quiet; then
            echo 'Kode sudah diperbarui, tidak ada commit baru.'
          else
            git commit -m 'Link7: auto repair overlapping Word textboxes before PDF conversion'
            git push origin HEAD:main
          fi
      - name: Deploy ulang GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          echo 'PENTING: setelah commit dan Pages berhasil, deploy Render dari latest commit.'
