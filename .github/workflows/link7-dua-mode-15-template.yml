      - name: Instal dependensi
        run: npm install --no-audit --no-fund

      - name: Build produksi GitHub Pages
        env:
          VITE_BASE_PATH: /Karyazainnet/
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - name: Commit source dan 15 master resmi (bukan workflow)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/journalConverter/App.tsx \
            src/journalConverter/data/journalTemplatesCatalog.ts \
            src/journalConverter/utils/journalTemplateService.ts \
            src/journalConverter/utils/bundleExport.ts \
            server/journal7/router.ts \
            public/articleTemplates
          if git diff --cached --quiet; then
            echo 'Semua kode mode template sudah terpasang.'
          else
            git commit -m "Link7: dua mode AI, 15 jurnal master DOCX, normalisasi LO dan ZIP"
            git push origin HEAD:main
          fi

      - name: Minta deployment GitHub Pages pada commit terbaru
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run pages.yml --ref main
          echo 'Deploy backend Render secara manual pada commit main terbaru untuk route /api/journal7/normalize-template.'
