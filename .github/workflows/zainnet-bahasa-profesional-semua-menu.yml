              ],
          }
          
          # This is a display-only mapping; keep categories in Supabase intact so historic blog
          # posts and filters continue to work. Never rewrite post data or category IDs.
          BLOG = 'src/components/AgcBlogView.tsx'
          BLOG_REPLACEMENTS = [
              ('<span>{cat}</span>', '<span>{cat === \'Teknologi & AI\' ? \'Teknologi Digital\' : cat}</span>'),
              ('{post.category}', "{post.category === 'Teknologi & AI' ? 'Teknologi Digital' : post.category}"),
              ('{selectedPost.category}', "{selectedPost.category === 'Teknologi & AI' ? 'Teknologi Digital' : selectedPost.category}"),
              ('{top.category}', "{top.category === 'Teknologi & AI' ? 'Teknologi Digital' : top.category}"),
              ('`Label: ${selectedCategory}`', "`Label: ${selectedCategory === 'Teknologi & AI' ? 'Teknologi Digital' : selectedCategory}`"),
          ]
          
          
          def replace_many(path: str, replacements: list[tuple[str,str]]) -> tuple[int, list[str]]:
              f = ROOT / path
              if not f.is_file():
                  raise RuntimeError(f'Missing source file: {path}')
              source = f.read_text(encoding='utf-8')
              original = source
              changed = 0
              missing = []
              for old, new in replacements:
                  if old == new:
                      continue
                  n = source.count(old)
                  if n:
                      source = source.replace(old, new)
                      changed += n
                  elif new not in source:
                      missing.append(old[:90])
              # No code identifiers, URLs, provider integrations, or auth settings are edited
              if source != original:
                  f.write_text(source, encoding='utf-8')
              return changed, missing
          
          
          def main() -> None:
              total = 0
              missing_all = []
              for path, changes in RULES.items():
                  updated, missing = replace_many(path, changes)
                  total += updated
                  print(f'{path}: {updated} occurrences updated')
                  if missing:
                      missing_all.append((path, missing))
              blog_count, blog_missing = replace_many(BLOG, BLOG_REPLACEMENTS)
              total += blog_count
              print(f'{BLOG}: {blog_count} display-only category labels updated')
              if blog_missing:
                  missing_all.append((BLOG, blog_missing))
          
              # Consistency: no lingering branding in reviewed customer-facing UI strings.
              ui_files = [ROOT / x for x in RULES if x.startswith('src/components/') or x.startswith('src/journalConverter/')]
              important_phrases = ['Gemini 3.1 Flash Lite', 'SCRIB ARTICLE AI', 'Tools AI Akademik', 'Bukan Buatan AI', 'AI COVER']
              remainders = []
              for f in ui_files:
                  content = f.read_text(encoding='utf-8')
                  for phrase in important_phrases:
                      if phrase in content:
                          remainders.append((str(f.relative_to(ROOT)),phrase))
              if remainders:
                  print('Remaining reviewed UI terms:', remainders)
                  sys.exit(2)
              print(f'Public copy rebranding: {total} string occurrences updated.')
              if missing_all:
                  print('Optional old phrases already absent/changed:')
                  for file, missing in missing_all:
                      print(' ', file, ':', '; '.join(missing))
              print('Internal IDs and model identifiers remain unchanged.')
          
          if __name__ == '__main__':
              main()
          PYCODE
          # Koreksi spasi sisa pada satu file sumber sebelum pemeriksaan diff.
          # Hanya merapikan whitespace; bukan mengabaikan validasi.
          sed -i 's/[[:blank:]]*$//' src/utils/agcDeepArticleGenerator.ts
          git diff --check

      - name: Instal dependensi
        run: npm ci --no-audit --no-fund

      - name: Uji build produksi
        run: npm run build

      - name: Simpan perubahan yang lolos pengujian
        shell: bash
        run: |
          git add -u -- src server.ts public/hardcover
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan baru; seluruh istilah sudah diperbarui."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "style(copy): professional ZAIN.NET customer-facing terminology"
          git push origin HEAD:main
