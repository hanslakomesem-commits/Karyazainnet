name: ZAIN.NET - Bahasa Profesional Seluruh Website

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zainnet-professional-public-copy
  cancel-in-progress: false

jobs:
  update-copy:
    name: Perapian bahasa publik ZAIN.NET
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Siapkan Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Perbarui teks publik tanpa mengubah API atau identitas teknis
