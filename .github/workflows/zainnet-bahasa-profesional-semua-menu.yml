              'public/hardcover/index.html': [
                  ('ZAIN.NET AI Cover Skripsi', 'ZAIN.NET Cover Skripsi Presisi'),
                  ('AI COVER', 'COVER PRESISI'),
                  ('OCR Gemini', 'pembacaan teks otomatis'),
                  ('Gemini OCR hanya untuk gambar', 'Pengenalan teks otomatis untuk gambar'),
                  ('cek hasil AI', 'periksa hasil pembacaan otomatis'),
                  ('tanpa Gemini', 'tanpa pemrosesan eksternal'),
                  ('Foto memakai Gemini.', 'Foto menggunakan pembacaan teks otomatis.'),
              ],
              'public/hardcover/app.js': [
                  ("'PDF & Gemini siap'", "'Pemrosesan PDF dan foto siap'"),
                  ("'PDF / Word lokal siap · Foto Gemini belum diatur'", "'PDF / Word siap · Analisis foto belum dikonfigurasi'"),
              ],
              'src/data/agcDeepArticlesData.ts': [
                  ('Foto AI SEO:', 'Ilustrasi Analisis SEO:'),
              ],
              'src/utils/agcDeepArticleGenerator.ts': [
