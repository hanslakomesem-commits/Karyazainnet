name: ZAIN.NET - Link 7 Mobile Friendly Auto Kembali V1
'on':
  push:
    paths:
    - .github/workflows/zainnet-link7-mobile-autoreturn-v1.yml
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: zainnet-link7-mobile-autoreturn
  cancel-in-progress: false
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: true
    - name: Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Patch tampilan mobile dan kembali otomatis
      shell: bash
      env:
        PATCH_B64: 
      run: 'printf %s "$PATCH_B64" | base64 --decode > /tmp/zainnet_link7_mobile.py

        python3 -m py_compile /tmp/zainnet_link7_mobile.py

        python3 /tmp/zainnet_link7_mobile.py

        git diff --check'
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Build validate
      run: npm run build
    - name: Commit verified patch
      shell: bash
      run: "git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add src/journalConverter/App.tsx src/components/ToolViewerModal.tsx\nif ! git diff --cached --quiet; then\n  git commit -m \"fix(link7): compact mobile ZIP status and automatic return after download request\"\n  git push origin HEAD:main\nfi"
