name: ZAIN.NET - Menu 3 Link 3 Rombak Total dan Daftar Isi Otomatis
on:
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/zainnet-menu3-link3-rombak-total.yml
permissions:
  contents: write
  actions: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: true
    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Patch penomoran dan Daftar Isi manual
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/zain_menu3_patch.py <<'PY_PATCH'\nfrom pathlib import Path\n\nROOT = Path.cwd()\nTAG = 'ZAINNET_MENU3_TOC_PAGEREF_PRESERVE_V1'\n\ndef patch(path, old, new, title):\n    p = ROOT / path\n    if not p.is_file():\n        raise SystemExit(f'{title}: file tidak ada: {path}')\n    text = p.read_text(encoding='utf-8')\n    if new in text:\n        print('SUDAH TERPASANG:', title)\n        return\n    n = text.count(old)\n    if n != 1:\n        raise SystemExit(f'{title}: sumber berubah / pencocokan {n}, dibatalkan tanpa mengubah {path}')\n    p.write_text(text.replace(old, new, 1), encoding='utf-8')\n    print('DIPERBARUI:', title)\n\nTOC = 'src/utils/docxTocProcessor.ts'\nVIEW = 'src/components/SkripsiPaginatorFixedView.tsx'\nMODAL = 'src/components/ToolViewerModal.tsx'\nENGINE = 'src/utils/docxPaginatorFixed.ts'\n\npatch(TOC,\n  \"  options: { includeTitleHeading: boolean; isArabic?: boolean; numberingProfile?: DocumentNumberingProfile }\",\n  \"  options: { includeTitleHeading: boolean; isArabic?: boolean; numberingProfile?: DocumentNumberingProfile; manualRows?: Array<{label: string; page: string; level: 1 | 2 | 3; bookmarkName: string}> } // \" + TAG,\n  'Builder menerima baris daftar isi manual')\n\npatch(TOC,\n  \"    const isRowArabic = useArabicStyle || hasArabicScript(label);\",\n  \"    // Baris yang belum terhubung dipertahankan statis, bukan ditebak.\\n    if (!bookmarkName) {\\n      sdtContent.appendChild(createManualTocParagraph(doc, label, pageStr, level, useArabicStyle || hasArabicScript(label)));\\n      return;\\n    }\\n    const isRowArabic = useArabicStyle || hasArabicScript(label);\",\n  'Judul yang belum terhubung tidak dibuatkan referensi palsu')\n\npatch(TOC,\n  '''  let firstRow = true;\n  for (const f of frontEntries) {\n    addTocRow(f.title, f.page, 1, f.bookmarkName, firstRow);\n    firstRow = false;\n  }\n  for (const item of entries) {\n    addTocRow(item.fullText, item.estimatedPage, item.level, item.bookmarkName, firstRow);\n    firstRow = false;\n  }''',\n  '''  let firstRow = true;\n  if (options.manualRows) {\n    // Don't replace the user's correct titles/order with newly inferred headings.\n    for (const row of options.manualRows) {\n      addTocRow(row.label, row.page, row.level, row.bookmarkName, false);\n      firstRow = false;\n    }\n  } else {\n    for (const f of frontEntries) {\n      addTocRow(f.title, f.page, 1, f.bookmarkName, firstRow);\n      firstRow = false;\n    }\n    for (const item of entries) {\n      addTocRow(item.fullText, item.estimatedPage, item.level, item.bookmarkName, firstRow);\n      firstRow = false;\n    }\n  }''',\n  'Pertahankan seluruh teks dan urutan daftar isi manual')\n\npatch(TOC,\n  '''  // End field character for outer TOC field\n  const endP = doc.createElementNS(W_NS, 'w:p');\n  const rEnd = doc.createElementNS(W_NS, 'w:r');\n  const fldEnd = doc.createElementNS(W_NS, 'w:fldChar');\n  setVal(fldEnd, 'fldCharType', 'end');\n  rEnd.appendChild(fldEnd);\n  endP.appendChild(rEnd);\n  sdtContent.appendChild(endP);''',\n  '''  // Manual-preserve uses individual PAGEREF fields only: Word's TOC rebuild\n  // would overwrite the original titles, so never wrap these rows in a TOC field.\n  if (!options.manualRows) {\n    const endP = doc.createElementNS(W_NS, 'w:p');\n    const rEnd = doc.createElementNS(W_NS, 'w:r');\n    const fldEnd = doc.createElementNS(W_NS, 'w:fldChar');\n    setVal(fldEnd, 'fldCharType', 'end');\n    rEnd.appendChild(fldEnd);\n    endP.appendChild(rEnd);\n    sdtContent.appendChild(endP);\n  }''',\n  'Jangan menghapus judul manual saat Word memperbarui Daftar Isi')\n\npatch(TOC,\n  '''  const shouldGenerateAutomaticToc =\n    tocMode === 'auto_generate' ||\n    !hasTocDetected ||\n    tocKind === 'keyword_only';''',\n  '''  const shouldGenerateAutomaticToc =\n    tocMode === 'auto_generate' ||\n    tocMode === 'auto_detect' ||\n    !hasTocDetected ||\n    tocKind === 'keyword_only';''',\n  'Mode otomatis memilih pelestarian isi manual')\n\ninsert='''  // Preserve the manual TOC source, including original wording, line order,\n  // and old page numbers as cached display values; match to real body bookmarks.\n  const manualPreservedRows: Array<{label: string; page: string; level: 1 | 2 | 3; bookmarkName: string}> | undefined =\n    tocMode === 'auto_detect' && manualRange ? (() => {\n      const rows: Array<{label: string; page: string; level: 1 | 2 | 3; bookmarkName: string}> = [];\n      const used = new Set<string>();\n      let missing = 0;\n      for (const original of paragraphs.slice(manualRange.startIdx, manualRange.endIdx + 1)) {\n        const raw = getParaText(original).trim();\n        if (!raw) continue;\n        const { cleanEntry, trailingPage } = stripLeadingLeaderAndPage(raw);\n        if (!cleanEntry) continue;\n        const norm = normalize(cleanEntry);\n        const arab = normalizeArabicKey(cleanEntry);\n        // Exclude only actual column headers, never remove real manual entries.\n        if (/^(?:JUDUL\\s+)?HALAMAN$/.test(norm) || /^(?:الموضوع\\s+)?(?:الصفحه|رقم\\s+الصفحه|الموضوع)$/.test(arab)) continue;\n        const allMatches = [\n          ...frontEntries.map(f => ({ fullText: f.title, titleText: f.title, level: 1 as const, bookmarkName: f.bookmarkName, estimatedPage: f.page })),\n          ...bodyHeadings.map(h => ({ fullText: h.fullText, titleText: h.titleText, level: h.level, bookmarkName: h.bookmarkName, estimatedPage: h.estimatedPage }))\n        ];\n        const comparable = (candidate: {fullText: string; titleText: string}) => {\n          const n1 = normalize(candidate.fullText), n2 = normalize(candidate.titleText);\n          return n1 === norm || n2 === norm ||\n            (hasArabicScript(cleanEntry) && (normalizeArabicKey(candidate.fullText) === arab || normalizeArabicKey(candidate.titleText) === arab));\n        };\n        // Prefer a uniquely matched real heading; never link an ambiguous item.\n        const available = allMatches.filter(h => comparable(h) && !used.has(h.bookmarkName));\n        const matched = available.length === 1 ? available[0] : undefined;\n        if (matched) used.add(matched.bookmarkName);\n        else missing++;\n        rows.push({\n          label: cleanEntry,\n          page: matched?.estimatedPage || trailingPage || '',\n          level: matched?.level || (/^(?:BAB\\s+[IVX0-9]+|HALAMAN\\s+|DAFTAR\\s+)/i.test(cleanEntry) ? 1 : 2),\n          bookmarkName: matched?.bookmarkName || ''\n        });\n      }\n      if (rows.length === 0) {\n        throw new Error('Daftar Isi manual terbaca kosong. Isi asli tidak dihapus.');\n      }\n      revisionLogs.push(`Daftar Isi manual: ${rows.length} baris asli dipertahankan, ${rows.length - missing} terhubung ke nomor halaman Word (PAGEREF).`);\n      if (missing) revisionLogs.push(`PERINGATAN: ${missing} baris belum punya judul Word yang cocok dan masih menggunakan nomor lama. Periksa sebelum cetak.`);\n      return rows;\n    })() : undefined;\n\n'''\npatch(TOC,\n  '''  // Build <w:sdt> TOC (omit internal \"DAFTAR ISI\" / \"فهرس المحتويات\" heading if the document already has the keyword paragraph)\n  const tocSdt = buildOpenXmlTocSdt(docXml, bodyHeadings, frontEntries, {\n    includeTitleHeading: !hasKeywordParagraph,\n    isArabic: isArabicDoc,\n    numberingProfile\n  });''',\n  insert+'''  // Build a Word content-control table with individually updatable page references.\n  const tocSdt = buildOpenXmlTocSdt(docXml, bodyHeadings, frontEntries, {\n    includeTitleHeading: !hasKeywordParagraph,\n    isArabic: isArabicDoc,\n    numberingProfile,\n    manualRows: manualPreservedRows\n  });''',\n  'Gunakan judul manual asli dan field PAGEREF yang dapat diperbarui')\n\npatch(VIEW,\n  \"interface SkripsiPaginatorFixedViewProps {\\n  onCorrectionComplete?: (fileName: string) => void;\\n}\",\n  \"interface SkripsiPaginatorFixedViewProps {\\n  onCorrectionComplete?: (fileName: string) => void;\\n  initialTocMode?: TocProcessMode;\\n}\",\n  'Konfigurasi terpisah Link 2 dan Link 3')\npatch(VIEW,\n  \"export const SkripsiPaginatorFixedView: React.FC<SkripsiPaginatorFixedViewProps> = ({ onCorrectionComplete }) => {\",\n  \"export const SkripsiPaginatorFixedView: React.FC<SkripsiPaginatorFixedViewProps> = ({ onCorrectionComplete, initialTocMode = 'auto_detect' }) => {\",\n  'Menerima mode daftar isi per link')\npatch(VIEW,\n  \"const [tocMode, setTocMode] = useState<TocProcessMode>('auto_generate');\",\n  \"const [tocMode, setTocMode] = useState<TocProcessMode>(initialTocMode); // \" + TAG,\n  'Default pelestarian daftar isi manual')\npatch(MODAL,\n  '''            <SkripsiPaginatorFixedView\n              onCorrectionComplete={(outFileName) => {''',\n  '''            <SkripsiPaginatorFixedView\n              initialTocMode={tool.id === 'num-3' ? 'auto_detect' : 'manual_sync'}\n              onCorrectionComplete={(outFileName) => {''',\n  'Pisahkan preferensi awal Link 2 dari Link 3')\n\n# Keep existing Word layout wherever possible. Do not clean original blank\n# paragraphs/page-breaks during the numbering-only pipeline.\npatch(ENGINE,\n  '  normalizeLeadingCoverSpacers(body);',\n  '  // Preserve cover paragraphs, including intentional blank lines.\\n  // normalizeLeadingCoverSpacers(body); // ' + TAG,\n  'Jaga jarak kosong cover asli')\npatch(ENGINE,\n  '          cleanRedundantBreaksAtBoundary(ps, targetIdx);',\n  '          // Existing page breaks may be intentional; do not remove them.\\n          // cleanRedundantBreaksAtBoundary(ps, targetIdx);',\n  'Jangan hapus page break asli')\npatch(ENGINE,\n  '''    if (bodySect && sect !== bodySect) {\n      copyGeometry(bodySect, sect);\n    }''',\n  '''    if (bodySect && sect !== bodySect && !hasGeometry(sect)) {\n      copyGeometry(bodySect, sect); // Fill only missing page geometry.\n    }''',\n  'Pertahankan margin tiap section yang sudah ada')\n\npatch(VIEW,\n  '''      triggerDownload(correctedBlob, fileName);\n      if (onCorrectionComplete) {''',\n  '''      triggerDownload(correctedBlob, fileName);\n      // A browser download request is not proof the file was actually saved.\n      if (onCorrectionComplete) {''',\n  'Dokumentasi validasi unduhan')\n\npatch(VIEW,\n  '                    <div className=\"grid grid-cols-1 md:grid-cols-2 gap-2.5\">',\n  \"\"\"                    <button\n                      type=\"button\"\n                      onClick={() => setTocMode('auto_detect')}\n                      className={`w-full text-left p-3 rounded-xl border cursor-pointer ${tocMode === 'auto_detect' ? 'border-emerald-600 bg-emerald-50 ring-1 ring-emerald-500' : 'border-slate-200 bg-slate-50'}`}\n                    >\n                      <span className=\"text-xs font-bold text-slate-900\">Disarankan: Salin Daftar Isi Manual dan Hubungkan Nomor Otomatis</span>\n                      <p className=\"text-[11px] text-slate-600 mt-1\">Judul dan urutan tetap sama. Nomor yang cocok memakai field Word PAGEREF. Setelah unduh, buka di Word lalu perbarui field (Ctrl+A, F9).</p>\n                    </button>\n                    <div className=\"grid grid-cols-1 md:grid-cols-2 gap-2.5\">\"\"\",\n  'Pilihan mode aman pelestarian daftar isi untuk HP')\n\npatch(VIEW,\n  '    URL.revokeObjectURL(url);',\n  '    // Mobile browsers may not have consumed the download URL immediately.\\n    setTimeout(() => URL.revokeObjectURL(url), 60000);',\n  'Jangan terlalu cepat menghapus URL unduhan HP')\n\nprint('Patch selesai; jalankan build lalu cek output DOCX di Microsoft Word/LibreOffice.')\n\nPY_PATCH\npython3 /tmp/zain_menu3_patch.py"
    - name: Terapkan tampilan Link 3 baru (mobile-first)
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/zain_link3_ui.py <<'PY_UI'\nfrom pathlib import Path\nROOT = Path.cwd()\nVIEW = ROOT / 'src/components/SkripsiPaginatorFixedView.tsx'\nMODAL = ROOT / 'src/components/ToolViewerModal.tsx'\nNEW = ROOT / 'src/components/SkripsiPaginatorLink3View.tsx'\nTAG = 'ZAINNET_LINK3_WIZARD_V1'\n\ndef replace_once(p, old, new, title):\n    s = p.read_text(encoding='utf-8')\n    if new in s:\n        print('SUDAH:', title)\n        return\n    n = s.count(old)\n    if n != 1:\n        raise SystemExit(f'{title}: code tidak cocok (ditemukan {n}). Tidak menulis file.')\n    p.write_text(s.replace(old, new, 1), encoding='utf-8')\n    print('OK:', title)\n\nreplace_once(VIEW,\n    \"  initialTocMode?: TocProcessMode;\",\n    \"  initialTocMode?: TocProcessMode;\\n  initialProfile?: DocumentNumberingProfile; // \" + TAG,\n    'Tambahkan profile dari halaman pilih jenis dokumen')\nreplace_once(VIEW,\n    \"({ onCorrectionComplete, initialTocMode = 'auto_detect' }) => {\",\n    \"({ onCorrectionComplete, initialTocMode = 'auto_detect', initialProfile = 'skripsi' }) => {\",\n    'Terima konfigurasi pilihan pertama')\nreplace_once(VIEW,\n    \"useState<DocumentNumberingProfile>('skripsi');\",\n    \"useState<DocumentNumberingProfile>(initialProfile);\",\n    'Inisialisasi jenis dokumen dari wizard')\n\ncomponent = r'''import React, { useState } from 'react';\nimport { ArrowLeft, ArrowRight, BookOpen, FileText, GraduationCap, Layers, ScrollText, CheckCircle2, ShieldCheck, Globe2, UploadCloud } from 'lucide-react';\nimport { SkripsiPaginatorFixedView } from './SkripsiPaginatorFixedView';\nimport type { DocumentNumberingProfile } from '../utils/docxPaginatorFixed';\n\n/** ZAINNET_LINK3_WIZARD_V1 — dedicated mobile-first Link 3 flow; Link 2 stays unchanged. */\ninterface Props { onCorrectionComplete?: (fileName: string) => void }\ntype Kind = 'skripsi' | 'proposal' | 'makalah' | 'tesis';\ntype Language = 'id' | 'ar';\nconst options = [\n  { id: 'skripsi' as const, label: 'Skripsi', desc: 'Romawi untuk awal, angka mulai BAB I', icon: GraduationCap },\n  { id: 'proposal' as const, label: 'Proposal', desc: 'Format proposal penelitian', icon: FileText },\n  { id: 'makalah' as const, label: 'Makalah', desc: 'Nomor halaman makalah akademik', icon: BookOpen },\n  { id: 'tesis' as const, label: 'Tesis', desc: 'Nomor bab hingga BAB VI', icon: ScrollText },\n];\n\nexport const SkripsiPaginatorLink3View: React.FC<Props> = ({ onCorrectionComplete }) => {\n  const [kind, setKind] = useState<Kind | null>(null);\n  const [language, setLanguage] = useState<Language>('id');\n  const [ready, setReady] = useState(false);\n  const selected = options.find(v => v.id === kind);\n  const profile: DocumentNumberingProfile = language === 'ar' ? (`arab-${kind || 'skripsi'}` as DocumentNumberingProfile) : (kind || 'skripsi');\n\n  if (ready && kind) return (\n    <main className=\"min-h-full bg-slate-100 text-slate-900\" data-testid=\"zainnet-link3-editor\">\n      <div className=\"sticky top-0 z-40 border-b border-indigo-100 bg-white/95 backdrop-blur shadow-sm px-3 py-3 sm:px-6\">\n        <div className=\"mx-auto max-w-5xl flex flex-wrap items-center gap-3\">\n          <button type=\"button\" onClick={() => setReady(false)} className=\"rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-indigo-800 flex items-center gap-1\"><ArrowLeft size={15}/> Ubah pilihan</button>\n          <div className=\"min-w-0 flex-1\"><p className=\"text-xs text-slate-500\">MENU 3 / LINK 3 · LANGKAH 3–4</p><p className=\"text-sm font-black truncate\">{selected?.label} · {language === 'ar' ? 'Arabic' : 'Indonesia'}</p></div>\n          <span className=\"text-[11px] font-bold rounded-full bg-emerald-50 text-emerald-800 px-3 py-1.5\">Edit + Unduh DOCX</span>\n        </div>\n      </div>\n      <SkripsiPaginatorFixedView key={`${profile}-${kind}`} initialProfile={profile} initialTocMode=\"auto_detect\" onCorrectionComplete={onCorrectionComplete}/>\n    </main>\n  );\n\n  return (\n    <main className=\"min-h-full bg-gradient-to-b from-indigo-950 via-slate-900 to-slate-100 pb-12 text-slate-900\" data-testid=\"zainnet-link3-wizard\">\n      <section className=\"max-w-4xl mx-auto px-4 pt-7 sm:pt-10\">\n        <div className=\"text-indigo-200 text-[11px] uppercase tracking-[.22em] font-bold mb-2\">ZAIN.NET · MENU 3 · LINK 3</div>\n        <h1 className=\"text-2xl sm:text-4xl font-extrabold text-white tracking-tight\">Edit Penomoran Halaman</h1>\n        <p className=\"text-indigo-100/80 mt-2 text-sm sm:text-base\">Pilih jenis dokumen terlebih dahulu. Kemudian tentukan bahasa dan lanjutkan untuk upload file Word.</p>\n        <div className=\"grid grid-cols-4 gap-2 mt-6 mb-6\">\n          {['Jenis file', 'Bahasa', 'Upload & cek', 'Unduh'].map((label, i) => (\n            <div key={label} className=\"space-y-1.5\">\n              <div className={`h-1.5 rounded-full ${i === 0 || (i === 1 && kind) ? 'bg-indigo-400' : 'bg-white/20'}`}/>\n              <p className={`text-[10px] sm:text-xs ${i < 2 ? 'text-white' : 'text-indigo-200/80'}`}>{i + 1}. {label}</p>\n            </div>\n          ))}\n        </div>\n        <div className=\"bg-white rounded-3xl p-4 sm:p-7 shadow-xl border border-indigo-100 space-y-5\">\n          <header><p className=\"text-xs text-indigo-600 font-bold uppercase tracking-wider\">Langkah 1</p><h2 className=\"text-xl font-extrabold mt-1\">Pilih jenis dokumen</h2><p className=\"text-sm text-slate-500\">Jenis dokumen menentukan aturan nomor halaman dan pergantian BAB.</p></header>\n          <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-3\">\n            {options.map(({id,label,desc,icon:Icon},idx)=> (\n              <button key={id} type=\"button\" onClick={() => setKind(id)} aria-pressed={kind === id} className={`text-left flex gap-3 items-start rounded-2xl p-4 border-2 transition-all min-h-[88px] ${kind === id ? 'border-indigo-600 bg-indigo-50 shadow-sm' : 'border-slate-200 bg-white hover:border-indigo-300'}`}>\n                <span className={`rounded-xl p-2.5 ${kind === id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-indigo-700'}`}><Icon size={22}/></span>\n                <span className=\"flex-1\"><span className=\"block font-bold text-base\">{idx + 1}. {label}</span><span className=\"block text-xs text-slate-500 mt-1\">{desc}</span></span>\n                {kind === id && <CheckCircle2 size={20} className=\"text-indigo-600 shrink-0\"/>}\n              </button>\n            ))}\n          </div>\n          <hr className=\"border-slate-100\"/>\n          <div className=\"space-y-3\">\n            <header><p className=\"text-xs text-indigo-600 font-bold uppercase tracking-wider\">Langkah 2</p><h2 className=\"text-lg font-extrabold\">Bahasa dokumen</h2></header>\n            <div className=\"grid grid-cols-2 gap-3\">\n              <button type=\"button\" onClick={() => setLanguage('id')} aria-pressed={language === 'id'} className={`rounded-xl border-2 p-3 text-left ${language==='id' ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200'}`}><span className=\"block font-bold text-sm\">Indonesia</span><span className=\"block text-xs text-slate-500 mt-1\">i, ii, iii · 1, 2, 3</span></button>\n              <button type=\"button\" onClick={() => setLanguage('ar')} aria-pressed={language === 'ar'} className={`rounded-xl border-2 p-3 text-left ${language==='ar' ? 'border-indigo-600 bg-indigo-50' : 'border-slate-200'}`}><span className=\"block font-bold text-sm\">Arabic</span><span className=\"block text-xs text-slate-500 mt-1\">ب، ج · ١، ٢، ٣</span></button>\n            </div>\n          </div>\n          <div className=\"rounded-xl border border-emerald-100 bg-emerald-50 p-3 flex gap-2.5 text-xs text-emerald-950\"><ShieldCheck size={20} className=\"shrink-0\"/><p><strong>Daftar Isi manual diprioritaskan.</strong> Isi dan urutan dipertahankan bila dapat dikenali. Nomor yang cocok diberi field PAGEREF; hasil final masih perlu pembaruan field di Word. Judul yang belum cocok harus diperiksa sebelum cetak.</p></div>\n          <button disabled={!kind} onClick={() => setReady(true)} type=\"button\" className=\"w-full rounded-2xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed text-white min-h-[54px] font-black flex items-center justify-center gap-2 shadow-md\">Lanjut ke Upload Word (.docx) <ArrowRight size={19}/></button>\n          <p className=\"text-xs text-center text-slate-500\">File diproses menggunakan mesin penomoran yang ada. Gunakan Word untuk memeriksa nomor halaman setelah perbarui field.</p>\n        </div>\n        <div className=\"mt-5 text-center text-xs text-indigo-100/70 flex items-center justify-center gap-2\"><Layers size={14}/> Word DOCX · Penomoran · Daftar Isi dinamis</div>\n      </section>\n    </main>\n  );\n};\n'''\nif not NEW.exists() or TAG not in NEW.read_text(encoding='utf-8'):\n    NEW.write_text(component, encoding='utf-8')\n    print('OK: Tampilan wizard Link 3 dibuat')\nelse:\n    print('SKIP: Tampilan wizard sudah ada')\nreplace_once(MODAL,\n    \"import { SkripsiPaginatorFixedView } from './SkripsiPaginatorFixedView';\",\n    \"import { SkripsiPaginatorFixedView } from './SkripsiPaginatorFixedView';\\nimport { SkripsiPaginatorLink3View } from './SkripsiPaginatorLink3View'; // \" + TAG,\n    'Impor tampilan baru Link 3')\nreplace_once(MODAL,\n    '''            <SkripsiPaginatorFixedView\n              initialTocMode={tool.id === 'num-3' ? 'auto_detect' : 'manual_sync'}''',\n    '''            {tool.id === 'num-3' ? <SkripsiPaginatorLink3View onCorrectionComplete={(outFileName) => {\n                handleAutoFinishDownload(outFileName, 'Koreksi nomor halaman dan Daftar Isi dinamis Link 3 selesai');\n              }}/> : <SkripsiPaginatorFixedView\n              initialTocMode={tool.id === 'num-3' ? 'auto_detect' : 'manual_sync'}''',\n    'Link 3 diarahkan ke wizard (Link 2 tetap editor lama)')\n# Close the JSX conditional after the fixed paginator's closing tag.\nreplace_once(MODAL,\n    '''            />\n          </div>\n        ) : tool.id === 'foto-1' ''',\n    '''            />}\n          </div>\n        ) : tool.id === 'foto-1' ''',\n    'Tutup percabangan Link 3 / Link 2')\nprint('Update desain Link 3 selesai')\n\nPY_UI\npython3 /tmp/zain_link3_ui.py"
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Build website
      env:
        VITE_BASE_PATH: /Karyazainnet/
      run: npm run build
    - name: Commit perubahan setelah build lulus
      shell: bash
      run: "set -euo pipefail\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add src/utils/docxTocProcessor.ts src/utils/docxPaginatorFixed.ts src/components/SkripsiPaginatorFixedView.tsx src/components/ToolViewerModal.tsx src/components/SkripsiPaginatorLink3View.tsx\nif git diff --cached --quiet; then\n  echo \"Tidak ada perubahan baru.\"\nelse\n  git commit -m \"feat(menu3): dynamic manual TOC plus redesigned Link 3 document-first wizard\"\n  git push origin HEAD:main\nfi"
    - name: Trigger GitHub Pages
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run pages.yml --ref main
