name: ZAIN.NET - Perbaiki Mutu Parafrase Menu 5 Link 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve-paraphrase:
    name: Optimasi bahasa akademik dan keamanan revisi DOCX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Terapkan perbaikan mesin parafrase
        shell: bash
        run: |
          python3 - <<'PY_PATCH'
          #!/usr/bin/env python3
          """Perbaikan kualitas editorial Menu 5 Link 2, tanpa mengubah pembayaran, auth atau kuota."""
          from pathlib import Path
          
          ROOT = Path.cwd()
          CHANGED = []
          
          
          def edit(path, editor):
              target = ROOT / path
              if not target.is_file():
                  raise RuntimeError(f'File tidak ditemukan: {path}')
              original = target.read_text(encoding='utf-8')
              if 'ZAINNET_MENU5_NATURAL_EDITOR_V1' in original:
                  print(f'Sudah terpasang: {path}')
                  return
              updated = editor(original)
              if updated == original:
                  raise RuntimeError(f'Patch tidak menghasilkan perubahan untuk {path}')
              target.write_text(updated, encoding='utf-8')
              CHANGED.append(path)
              print(f'Diperbarui: {path}')
          
          
          def once(s, old, new, name):
              count = s.count(old)
              if count != 1:
                  raise RuntimeError(f'Pola {name}: perlu 1 kecocokan, ditemukan {count}. Periksa sumber terbaru sebelum memasang.')
              return s.replace(old, new, 1)
          
          
          def between(s, left, right, replacement, label):
              if s.count(left) != 1 or s.count(right) != 1:
                  raise RuntimeError(f'Batas {label} tidak unik: {s.count(left)}, {s.count(right)}')
              i = s.index(left)
              j = s.index(right, i + len(left))
              return s[:i] + replacement + s[j:]
          
          
          def backend(s):
              # Hapus mesin sinonim statis yang menimbulkan frasa berat & klaim similarity palsu.
              s = between(s,
                  '/**\n * Comprehensive Academic Indonesian Lexical & Structural Replacement Library\n */',
                  'function escapeRegExp(string: string) {',
                  '''/**
           * ZAINNET_MENU5_NATURAL_EDITOR_V1
