              s=s[:i]+'''const prompt = `Anda adalah editor bahasa akademik Indonesia. Revisi naskah secara bertanggung jawab berdasarkan maksud dan gaya penulis asli, bukan untuk menyiasati pendeteksi otomatis.
          TUGAS:
