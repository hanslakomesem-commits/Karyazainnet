                  '        source?: string;\n        requiresReviewCount?: number;\n      }>(\'/api/paraphrase\', {',
                  'respon source')
              s=once(s,
                  '''          if (res) {
                      const finalParaphrase = res.paraphrasedText || seg.originalText;''',
