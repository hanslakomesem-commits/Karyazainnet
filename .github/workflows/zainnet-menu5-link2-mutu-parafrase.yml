      - name: Periksa whitespace dan pemformatan kode
        run: git diff --check

      - name: Install dependensi website
        run: npm install --no-audit --no-fund

      - name: Verifikasi build produksi
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Simpan perubahan hanya jika build berhasil
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Tidak ada perubahan baru; patch sudah terpasang."
            exit 0
