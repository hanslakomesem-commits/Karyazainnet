                  s=once(s,old,'"Tidak dapat diperkirakan tanpa pemeriksaan terpisah"',f'klaim {old}')
              s=once(s,'"Memecah klausa untuk menghilangkan cluster 5 kata berturut-turut."','"Membuat kalimat panjang lebih mudah dipahami."','rationale 1')
              s=once(s,'"Menggeser fokus anak kalimat ke depan dan mengganti verba menjadi nomina."','"Memperjelas susunan klausa tanpa mengubah fokus argumen."','rationale 2')
              s=once(s,'"Menyajikan intisari gagasan penulis tanpa keterikatan pada redaksi awal."','"Memadatkan gagasan tanpa menghilangkan fakta atau rujukan."','rationale 3')
              s=once(s,'"Memanfaatkan filter Exclude Quotes Turnitin untuk pasal atau teori paten."','"Mempertahankan kutipan asli dan sumbernya secara akurat."','rationale 4')
              return s
          
          
          def frontend(s):
              s=once(s, "const [selectedStyle, setSelectedStyle] = useState<ParaphraseStyle>('academic_formal');",
