            echo "Semua file sudah terkini. Tidak ada commit baru."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plagiarismV2 server/plagiarismV2 src/data/toolsData.ts src/components/ToolViewerModal.tsx src/App.tsx server.ts
