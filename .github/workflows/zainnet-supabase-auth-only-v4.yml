        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/zainnet_supabase_auth_only.py
          python3 -m py_compile /tmp/zainnet_supabase_auth_only.py
          python3 /tmp/zainnet_supabase_auth_only.py
          git diff --check
      - name: Install dependency dengan lockfile yang tetap
        run: npm ci --no-audit --no-fund
      - name: Build website dan pastikan TypeScript dapat diproses
        run: npm run build
      - name: Simpan perubahan source hanya jika build sukses
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/authService.ts src/components/LoginView.tsx src/App.tsx src/components/IframeLockedModal.tsx src/components/Navbar.tsx src/components/RoleManagementModal.tsx
          if git diff --cached --quiet; then
            echo 'Kode sudah terbaru, tidak perlu commit ulang.'
          else
            git commit -m 'security(auth): Supabase Auth-only admin reseller public, remove local PIN login'
            git push origin HEAD:main
          fi
