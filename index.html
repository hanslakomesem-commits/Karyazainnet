    <script>
      // Global Polyfills for ECMAScript 2024 / Legacy browsers (Firefox 115 ESR / Win7)
      if (typeof globalThis === 'undefined') {
        window.globalThis = window;
      }
      if (typeof globalThis.Iterator === 'undefined') {
        function Iterator() {}
        Iterator.prototype = Object.create(Object.prototype);
        globalThis.Iterator = Iterator;
      }
      if (typeof globalThis.Iterator.prototype.join !== 'function') {
        globalThis.Iterator.prototype.join = function(separator) {
          var sep = separator === undefined ? ',' : String(separator);
          try {
            return Array.from(this).join(sep);
          } catch(e) {
            return '';
          }
        };
      }
      if (typeof Promise.withResolvers !== 'function') {
        Promise.withResolvers = function() {
          var resolve, reject;
          var promise = new Promise(function(res, rej) {
            resolve = res;
            reject = rej;
          });
          return { promise: promise, resolve: resolve, reject: reject };
        };
      }
      if (typeof Promise.try !== 'function') {
        Promise.try = function(fn) {
          var args = Array.prototype.slice.call(arguments, 1);
          return new Promise(function(resolve) {
            resolve(fn.apply(void 0, args));
          });
        };
      }
      if (typeof Object.hasOwn !== 'function') {
        Object.hasOwn = function(obj, prop) {
          return Object.prototype.hasOwnProperty.call(obj, prop);
        };
      }
      if (!Array.prototype.at) {
        Array.prototype.at = function(index) {
          var k = index >= 0 ? index : this.length + index;
          return (k < 0 || k >= this.length) ? undefined : this[k];
        };
      }

      // Suppress harmless Vite HMR WebSocket connection errors in iframe preview environment
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) || '';
        var file = (e && e.filename) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('failed to connect') ||
          file.includes('@vite/client')
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason && (e.reason.message || String(e.reason))) || '';
        if (
          reason.includes('WebSocket') ||
          reason.includes('createWebSocketModuleRunnerTransport') ||
          reason.includes('failed to connect') ||
          reason.includes('@vite/client')
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return;
        }
        // Auto-recover if dynamic chunk import fails due to client cache mismatch
        if (
          reason.includes('Failed to fetch dynamically imported module') ||
          reason.includes('error loading dynamically imported module') ||
          reason.includes('Importing a module script failed')
        ) {
          if (!sessionStorage.getItem('zain_chunk_reload')) {
            sessionStorage.setItem('zain_chunk_reload', '1');
            window.location.reload();
          }
        }
      }, true);
    </script>
