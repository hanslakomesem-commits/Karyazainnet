# Optional: Render Dashboard > New > Blueprint > select this repository.
services:
  - type: web
    name: zainnet-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
