        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/zainnet_patch_empty_template.py
          python3 -m py_compile /tmp/zainnet_patch_empty_template.py
          python3 /tmp/zainnet_patch_empty_template.py
          node --check public/articleTemplates/js/docx-engine.js
          git diff --check
          python3 - <<'PYCODE'
          from pathlib import Path
          engine=Path('public/articleTemplates/js/docx-engine.js').read_text('utf-8')
          marker='ZAINNET_TEMPLATE_BOUNDARY_NO_BLANK_PAGE_V1_20261112'
          assert engine.count(marker)>=1
          assert engine.count('compactTemplateBoundary(tplDoc,rule,warnings)')==1
          assert 'const imported=appendMain(tplDoc,actualRule,extracted.content,prototype,warnings);' in engine
          print('Helper perbaikan batas Word sudah terpasang.')
          PYCODE
      - name: Install dependensi sesuai lockfile
        run: npm ci --no-audit --no-fund
      - name: Build website GitHub Pages
        run: npm run build
      - name: Simpan perubahan kode hanya jika audit dan build berhasil
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/articleTemplates/js/docx-engine.js
          if git diff --cached --quiet; then
            echo 'Patch sudah diterapkan sebelumnya. Tidak membuat commit baru.'
          else
            git commit -m 'fix(link7): audit 15 official journal templates and compact blank page boundaries'
            git push origin HEAD:main
          fi
